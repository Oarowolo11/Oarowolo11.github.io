{% include base_path %}
<style>
  .home-carousel { position: relative; width: 100%; aspect-ratio: 16 / 10; max-height: 420px; overflow: hidden; border-radius: 6px; margin: 0 0 1.5em 0; background: #f2f2f2; }
  .home-carousel__slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.9s ease; pointer-events: none; }
  .home-carousel__slide.is-active { opacity: 1; pointer-events: auto; }
  .home-carousel__slide img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block; }
  .home-carousel__caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 0.4em 0.8em; font-size: 0.75em; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,0.65)); text-align: left; }
  .home-carousel__slide a { color: inherit; text-decoration: none; }
  .home-carousel__dots { position: absolute; bottom: 0.4em; right: 0.8em; display: flex; gap: 6px; z-index: 2; }
  .home-carousel__dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid #fff; background: transparent; padding: 0; cursor: pointer; }
  .home-carousel__dot.is-active { background: #fff; }
</style>

<div class="home-carousel" id="home-carousel" aria-label="Photo highlights">
  {% for slide in site.data.carousel %}
  <figure class="home-carousel__slide{% if forloop.first %} is-active{% endif %}">
    {% if slide.link %}<a href="{{ base_path }}{{ slide.link }}">{% endif %}
      <img src="{{ base_path }}{{ slide.image }}" alt="{{ slide.caption }}"{% unless forloop.first %} loading="lazy"{% endunless %}>
      <figcaption class="home-carousel__caption">{{ slide.caption }}</figcaption>
    {% if slide.link %}</a>{% endif %}
  </figure>
  {% endfor %}
  <div class="home-carousel__dots" role="tablist">
    {% for slide in site.data.carousel %}
    <button class="home-carousel__dot{% if forloop.first %} is-active{% endif %}" data-index="{{ forloop.index0 }}" aria-label="Show photo {{ forloop.index }}"></button>
    {% endfor %}
  </div>
</div>

<script>
  (function () {
    var root = document.getElementById('home-carousel');
    if (!root) return;
    var slides = root.querySelectorAll('.home-carousel__slide');
    var dots = root.querySelectorAll('.home-carousel__dot');
    if (slides.length < 2) return;
    var current = 0, timer = null;
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function show(i) {
      slides[current].classList.remove('is-active');
      dots[current].classList.remove('is-active');
      current = (i + slides.length) % slides.length;
      slides[current].classList.add('is-active');
      dots[current].classList.add('is-active');
    }
    function start() {
      if (reduceMotion || timer) return;
      timer = setInterval(function () { show(current + 1); }, 4500);
    }
    function stop() { clearInterval(timer); timer = null; }

    dots.forEach(function (dot) {
      dot.addEventListener('click', function () { stop(); show(+dot.dataset.index); start(); });
    });
    root.addEventListener('mouseenter', stop);
    root.addEventListener('mouseleave', start);
    start();
  })();
</script>
